# Builds the game for the browser (WebAssembly) and publishes it, with the map
# atlas, to GitHub Pages:
#   https://sirgwain.github.io/castle-adventure/            the game
#   https://sirgwain.github.io/castle-adventure/atlas.html  the atlas
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./internal/...
      - name: Build site
        run: |
          mkdir -p site
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o site/castle.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/
          cp web/index.html site/
          cp out/atlas.html site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
