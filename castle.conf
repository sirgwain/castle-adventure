# DOSBox Staging settings for playing Castle Adventure (1984) at original speed.
#
# Run from the repository root:
#     dosbox -conf castle.conf
#
# The game has no timer: monsters move every 200 passes of the input loop, so
# their speed is set entirely by CPU speed. Emulating an IBM PC/XT (8088 at
# 4.77 MHz) gives about 5 monster steps per second, as in 1984 (see
# tools/timing.py, which measured ~57,000 instructions per monster step).

[dosbox]
# CGA, as on the original IBM PC. The game uses 40-column text mode.
machine = cga

[cpu]
# Fixed cycles per millisecond, roughly instructions per millisecond.
# DOSBox's reference value for an 8088 at 4.77 MHz is 300 (the default 3000 is
# a 386SX-20, ten times too fast). Raise this a little, e.g. 450-700, for an
# easier, AT-like pace, or lower it for a harder one.
core = normal
cpu_cycles = 300
cpu_cycles_protected = 300
cpu_throttle = off

[autoexec]
mount c Castle.1984
c:
castle
exit
